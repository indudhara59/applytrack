<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ApplyTrack Capture</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #fff;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-weight: 500;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #4f46e5;
        color: #fff;
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button.secondary {
        background: #fff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      button.secondary:hover {
        background: #f8fafc;
      }
      #status {
        margin-top: 14px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #f1f5f9;
        font-size: 12px;
      }
      #status.connected {
        background: #f0fdf4;
        color: #166534;
      }
      #status.disconnected {
        background: #fef2f2;
        color: #991b1b;
      }
      #saveMessage {
        margin-top: 8px;
        font-size: 12px;
        color: #475569;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>ApplyTrack Capture</h1>

    <label for="apiKey">API key</label>
    <input
      id="apiKey"
      type="password"
      placeholder="Paste your ApplyTrack API key"
      autocomplete="off"
    />

    <label for="siteUrl">ApplyTrack site URL</label>
    <input id="siteUrl" type="text" placeholder="https://your-app.vercel.app" />

    <button id="save">Save</button>
    <div id="saveMessage"></div>

    <button id="captureNow" class="secondary">Capture this job now</button>

    <div id="status">Checking status…</div>

    <script src="popup.js"></script>
  </body>
</html>
